name: codearea

services:
  web:
    build: .
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm start"]
    env_file:
      - path: .env
        required: true
    environment:
      APP_DATA_DIR: /app/data
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      start_period: 2m
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  app-data:
