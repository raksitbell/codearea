name: codearea-executor

services:
  piston:
    # Piston's prebuilt runtime packages are x86-64 only; pin amd64 so they run
    # (native on x86-64 hosts, Rosetta-emulated on Apple Silicon).
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    privileged: true
    env_file: .env
    ports:
      - "${PISTON_PORT:-2000}:2000"
    volumes:
      - piston-packages:/piston/packages
      - piston-data:/piston/data
    tmpfs:
      - /tmp:exec
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:2000/api/v2/runtimes"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  piston-packages:
  piston-data:
